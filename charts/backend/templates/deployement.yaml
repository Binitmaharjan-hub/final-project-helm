apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: finalproject
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata: 
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          ports: 
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: configmap-backend
                  key: DATABASE_URL
            
            - name: DATABASE_SSL
              valueFrom:
                configMapKeyRef:
                  name: configmap-backend
                  key: DATABASE_SSL
            
            - name: DB_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: configmap-backend
                  key: DB_POOL_MAX
            
            - name: DB_CONNECTION_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: configmap-backend
                  key: DB_CONNECTION_TIMEOUT_MS

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: finalproject
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  