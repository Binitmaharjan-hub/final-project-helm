apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finalproject-ingress
  namespace: finalproject

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3001

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80